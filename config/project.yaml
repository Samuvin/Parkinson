# Project + training config (webapp Config, train_dl.py).
# Feature column lists and CSV filenames: config/multimodal_features.yaml

data:
  raw_dir: data/raw
  processed_dir: data/processed
  random_state: 42
  train_size: 0.70
  val_size: 0.15
  multimodal_features_config: config/multimodal_features.yaml

deep_learning:
  epochs: 300
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 1.0e-3
  early_stopping_patience: 30
  dropout: 0.3
  embed_dim: 64
  se_reduction: 4

  # --- augmentation ---
  noise_std: 0.08
  feature_dropout: 0.12
  mixup_alpha: 0.2          # MixUp Beta alpha; 0 disables MixUp

  # --- loss ---
  focal_loss: true          # Focal BCE (better for class imbalance)
  focal_gamma: 2.0          # focusing exponent

  # --- regularisation ---
  label_smoothing: 0.05
  grad_clip_norm: 1.0

  # --- class balance ---
  use_smote: false          # ModalityMatchedDataset handles balance via label-matching

  # --- optimiser / scheduler ---
  # lr_scheduler: cosine_warmup | plateau | cosine | onecycle
  lr_scheduler: cosine_warmup
  warmup_epochs: 15         # linear warm-up before cosine decay
  onecycle_pct_start: 0.1

  # --- gradient accumulation ---
  accumulate_grad_batches: 2  # effective batch = batch_size × accumulate_grad_batches

  # --- misc ---
  seed: 42
  use_amp: true
  dataloader_num_workers: 0
  smote_k_neighbors: 5
  # early_stop_monitor: val_roc_auc | val_loss
  early_stop_monitor: val_roc_auc
  save_dir: models
