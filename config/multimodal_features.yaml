# Columns loaded from CSV for multimodal deep learning (train_dl.py, dl_models/data/dataset.py).
# Paths are relative to data.processed_dir (e.g. data/processed).

label_column: status

csv_paths:
  speech: speech/parkinsons.csv
  handwriting: handwriting/handwriting_data.csv
  gait: gait/gait_data.csv

speech_features:
  - MDVP:Fo(Hz)
  - MDVP:Fhi(Hz)
  - MDVP:Flo(Hz)
  - MDVP:Jitter(%)
  - MDVP:Jitter(Abs)
  - MDVP:RAP
  - MDVP:PPQ
  - Jitter:DDP
  - MDVP:Shimmer
  - MDVP:Shimmer(dB)
  - Shimmer:APQ3
  - Shimmer:APQ5
  - MDVP:APQ
  - Shimmer:DDA
  - NHR
  - HNR
  - RPDE
  - DFA
  - spread1
  - spread2
  - D2
  - PPE

handwriting_features:
  - tremor_power
  - spiral_irregularity
  - stroke_smoothness
  - contour_complexity
  - tremor_frequency
  - pen_up_ratio
  - mean_stroke_width
  - drawing_speed_proxy
  - line_waviness
  - fluency_score

gait_features:
  - stride_interval
  - stride_variability
  - swing_time
  - stance_time
  - double_support_time
  - gait_speed
  - cadence
  - step_length
  - stride_regularity
  - gait_asymmetry
