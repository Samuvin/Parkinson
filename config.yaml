# Multimodal PD deep learning training

data:
  raw_dir: data/raw
  random_state: 42
  train_size: 0.70
  val_size: 0.15
  # CSV column lists and paths (relative to raw_dir): see config/multimodal_features.yaml
  multimodal_features_config: config/multimodal_features.yaml

deep_learning:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 15
  dropout: 0.3
  embed_dim: 64
  se_reduction: 4
  noise_std: 0.05
  feature_dropout: 0.1
  use_smote: true
  save_dir: models
